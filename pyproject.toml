[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibesodb2"
version = "0.1.0"
description = "vibesODB2: Open-source, modular vehicle configuration, diagnostic, and telemetry engine for VAG (PQ25 / PQ35 / MQB) platforms."
readme = "README.md"
authors = [
    { name = "vibesODB2 Contributors" }
]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.21.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
vibesodb2 = "vibesodb2.cli:main"
opentransporter = "vibesodb2.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vibesodb2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*StarletteDeprecationWarning.*",
]
