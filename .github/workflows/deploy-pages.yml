name: Test & Deploy vibesODB2 PWA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: Automated Vehicle Simulator & Diagnostics Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate PWA JavaScript Syntax
        run: |
          node --check pwa/js/*.js
          node --check pwa/sw.js

      - name: Run PWA JavaScript Unit Tests
        run: |
          node --test --test-force-exit --test-timeout=10000 tests/js/

      - name: Run Python Simulator & Diagnostics Pytest Suite
        run: |
          pytest -v

      - name: Run Headless Chrome PWA End-to-End Simulation Test
        run: |
          python scripts/test_pwa_sim.py

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload PWA Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './pwa'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
