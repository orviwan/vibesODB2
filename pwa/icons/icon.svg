<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />
  
  <!-- Outer Tachometer Arc (270 degrees) -->
  <path d="M 120 370 A 170 170 0 1 1 392 370" fill="none" stroke="#1e293b" stroke-width="24" stroke-linecap="round" />
  <path d="M 120 370 A 170 170 0 1 1 345 155" fill="none" stroke="url(#neonGrad)" stroke-width="24" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 345 155 A 170 170 0 0 1 392 370" fill="none" stroke="#ef4444" stroke-width="24" stroke-linecap="round" />
  
  <!-- Center Dial -->
  <circle cx="256" cy="275" r="95" fill="#0f172a" stroke="#334155" stroke-width="4" />
  
  <!-- OBD-II Connector Silhouette / Logo -->
  <path d="M 216 235 L 296 235 L 312 265 L 296 295 L 216 295 L 200 265 Z" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linejoin="round" />
  <!-- OBD Pins -->
  <circle cx="230" cy="255" r="4" fill="#38bdf8" />
  <circle cx="248" cy="255" r="4" fill="#38bdf8" />
  <circle cx="266" cy="255" r="4" fill="#38bdf8" />
  <circle cx="284" cy="255" r="4" fill="#38bdf8" />
  <circle cx="230" cy="275" r="4" fill="#38bdf8" />
  <circle cx="248" cy="275" r="4" fill="#38bdf8" />
  <circle cx="266" cy="275" r="4" fill="#38bdf8" />
  <circle cx="284" cy="275" r="4" fill="#38bdf8" />

  <!-- Speed Needle -->
  <line x1="256" y1="275" x2="340" y2="185" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="256" cy="275" r="12" fill="#38bdf8" />

  <!-- App Label -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="2">vibesODB2</text>
</svg>
